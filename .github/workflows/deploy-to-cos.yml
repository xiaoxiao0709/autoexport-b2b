name: Deploy to Tencent Cloud COS

# 双轨同步：代码/数据仍在 GitHub，后台编辑仍写回 GitHub；
# 每次 push 到 main 后，本工作流自动把静态站点同步到腾讯云 COS（+CDN）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只挑选站点需要的文件，避免把 .git / .github 传上 COS
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html script.js chat.js dist/
          cp -r assets data admin dist/
          [ -f README.md ] && cp README.md dist/ || true

      - name: Upload to Tencent COS
        uses: TencentCloud/cos-action@v1
        with:
          secret_id:  ${{ secrets.TENCENT_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}
          cos_region: ${{ secrets.COS_REGION }}
          local_path: dist
          remote_path: /
          clean: true   # 镜像同步：删除 COS 上本地已不存在的文件（请确保该桶仅用于本站点）

      # 说明：若你在 COS 前挂了腾讯云 CDN，请在 CDN 控制台将 /data/* 的
      # 缓存 TTL 设为较短值（如 60s），或在上传后手动刷新 CDN 缓存，
      # 这样后台编辑后数据更新能在 TTL 内生效，无需自动 purge。
