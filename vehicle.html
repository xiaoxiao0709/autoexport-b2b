<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vehicle Details | Zhaoshang Zhilian</title>
  <link rel="icon" href="assets/logo-transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#101218;--muted:#6c7280;--line:#e5e7eb;--paper:#f7f7f8;--blue:#175cd3;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Manrope,system-ui;color:var(--ink);background:#fff}button,a{font:inherit}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}.wrap{width:min(1240px,calc(100% - 40px));margin:auto}
    header{height:76px;border-bottom:1px solid #ffffff20;background:#0e1117;color:#fff;display:flex;align-items:center;position:relative;z-index:5}.nav{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font:700 18px Space Grotesk}.brand img{width:42px;height:42px;object-fit:contain}.nav-actions{display:flex;align-items:center;gap:10px}.back,.lang{border:1px solid #ffffff30;background:transparent;color:#fff;padding:10px 15px;cursor:pointer}.lang.active{background:#fff;color:#111}
    .hero{background:#0e1117;color:#fff}.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr);min-height:620px}.visual{position:relative;background:linear-gradient(145deg,#f5f5f5,#d5d7da);overflow:hidden}.visual:after{content:"";position:absolute;left:12%;right:12%;bottom:9%;height:12%;background:#0003;filter:blur(34px);border-radius:50%}.main-image{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;padding:6%;animation:carIn 1s var(--ease) both}.summary{padding:70px clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#aab0bb;text-transform:uppercase;letter-spacing:.18em;font-size:11px}.summary h1{font:700 clamp(42px,5vw,72px)/.98 Space Grotesk;margin:16px 0 20px}.summary p{color:#bbc0c9;line-height:1.8}.price{font:700 28px Space Grotesk;margin-top:30px}.price small{display:block;color:#8d95a2;font:500 11px Manrope;letter-spacing:.13em;text-transform:uppercase;margin-bottom:7px}.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.btn{padding:14px 20px;border:0;font-weight:700;cursor:pointer}.primary{background:#fff;color:#111}.outline{border:1px solid #ffffff38;color:#fff;background:transparent}
    .thumbs{display:flex;gap:10px;overflow:auto;padding:14px;background:#fff}.thumb{width:120px;height:76px;flex:none;border:2px solid transparent;padding:0;cursor:pointer;background:#eee}.thumb.active{border-color:#111}.thumb img{width:100%;height:100%;object-fit:cover}
    main{padding:74px 0 110px}.section-title{font:700 clamp(27px,3vw,40px) Space Grotesk;margin:0 0 26px}.quick{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:70px}.metric{padding:25px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.metric:nth-child(4n){border-right:0}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.metric b{display:block;margin-top:9px;font-size:18px}.details{display:grid;grid-template-columns:1fr 1fr;gap:70px}.spec-table{border-top:1px solid var(--line)}.spec-row{display:grid;grid-template-columns:42% 58%;padding:16px 0;border-bottom:1px solid var(--line)}.spec-row span{color:var(--muted)}.feature-list{display:flex;flex-wrap:wrap;gap:9px}.feature{padding:10px 13px;background:var(--paper);border:1px solid var(--line);font-size:13px}.notes{margin-top:70px;padding:36px;background:#11151d;color:#fff}.notes p{color:#c3c8d0;line-height:1.8;max-width:850px}.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:none;z-index:10}.sticky .btn{width:100%;background:#111;color:#fff}
    .loading{min-height:70vh;display:grid;place-items:center;font-weight:700}.error{color:#b42318}@keyframes carIn{from{opacity:0;transform:scale(1.08) translateY(16px)}to{opacity:1;transform:none}}@media(max-width:800px){header{height:64px}.brand span{display:none}.hero-grid{grid-template-columns:1fr;min-height:0}.visual{height:360px}.summary{padding:42px 24px 52px}.summary h1{font-size:44px}.quick{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2n){border-right:0}.details{grid-template-columns:1fr;gap:55px}.sticky{display:block}main{padding-bottom:130px}.nav-actions .lang:nth-child(n+3){display:none}}
  </style>
</head>
<body>
  <header><div class="wrap nav"><a class="brand" href="index.html#vehicles"><img src="assets/logo-transparent.png" alt=""><span>Zhaoshang Zhilian</span></a><div class="nav-actions"><a class="back" href="index.html#vehicles" id="backLink">Back to Vehicles</a><button class="lang" data-lang="en">EN</button><button class="lang" data-lang="zh">中</button><button class="lang" data-lang="ar">ع</button><button class="lang" data-lang="ru">RU</button></div></div></header>
  <div id="loading" class="loading">Loading vehicle...</div>
  <div id="page" hidden>
    <section class="hero"><div class="hero-grid"><div><div class="visual"><img class="main-image" id="mainImage" alt=""></div><div class="thumbs" id="thumbs"></div></div><div class="summary"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="description"></p><div class="price"><small id="priceLabel"></small><span id="price"></span></div><div class="actions"><button class="btn primary" id="quoteBtn"></button><a class="btn outline" id="waBtn" target="_blank">WhatsApp</a></div></div></div></section>
    <main class="wrap"><h2 class="section-title" id="overviewTitle"></h2><div class="quick" id="quick"></div><div class="details"><section><h2 class="section-title" id="specTitle"></h2><div class="spec-table" id="specTable"></div></section><section><h2 class="section-title" id="featureTitle"></h2><div class="feature-list" id="features"></div></section></div><section class="notes"><h2 id="notesTitle"></h2><p id="notes"></p></section></main>
  </div>
  <div class="sticky"><button class="btn" id="stickyQuote"></button></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="data/supabase-config.js"></script><script src="vehicle.js?v=1"></script>
</body></html>
