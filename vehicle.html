<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vehicle Details | Zhaoshang Zhilian</title>
  <link rel="icon" href="assets/logo-transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#141619;--muted:#687078;--line:#e5e8eb;--soft:#f5f6f7;--paper:#fff;--green:#0b6b4f;--blue:#174ea6;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 Manrope,system-ui,"Microsoft YaHei",sans-serif}button,a{font:inherit}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}.wrap{width:min(1240px,calc(100% - 48px));margin:auto}
    header{height:76px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;position:sticky;top:0;z-index:20}.nav{display:flex;align-items:center;justify-content:space-between;gap:25px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.03em}.brand img{width:39px;height:39px;object-fit:contain}.brand span{font-size:17px}.nav-right{display:flex;align-items:center;gap:8px}.back,.lang{height:38px;border:1px solid var(--line);background:#fff;padding:0 13px;cursor:pointer}.back:hover,.lang:hover{border-color:#9ca4ab}.lang.active{background:var(--ink);border-color:var(--ink);color:#fff}
    .crumbs{padding:24px 0 16px;color:var(--muted);font-size:12px}.crumbs a{text-decoration:underline;text-underline-offset:3px}.loading{min-height:75vh;display:grid;place-items:center;color:var(--muted)}.error{color:#ad281d}
    .top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:54px;padding:12px 0 64px}.gallery{min-width:0}.main-frame{aspect-ratio:1.38;background:linear-gradient(145deg,#f4f5f5,#e5e8e8);display:grid;place-items:center;overflow:hidden;position:relative}.main-frame:before{content:"";position:absolute;inset:14px;border:1px solid #fff9;pointer-events:none}.main-frame:after{content:"";position:absolute;width:66%;height:9%;bottom:12%;border-radius:50%;background:#10251d33;filter:blur(28px)}.main-image{position:relative;z-index:1;width:100%;height:100%;padding:5%;object-fit:contain;animation:enter .9s var(--ease) both}.gallery-count{position:absolute;right:22px;bottom:18px;z-index:2;background:#fff;padding:5px 9px;font-size:11px}.thumbs{display:flex;gap:9px;overflow:auto;padding-top:12px}.thumb{width:104px;height:70px;padding:0;border:1px solid var(--line);background:#f0f1f1;flex:none;cursor:pointer}.thumb.active{border:2px solid var(--ink)}.thumb img{width:100%;height:100%;object-fit:cover}
    .summary{padding:18px 0}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.summary h1{font-size:clamp(38px,4.8vw,66px);line-height:1.02;letter-spacing:-.06em;margin:14px 0 18px}.summary-copy{color:var(--muted);max-width:480px;margin:0;line-height:1.85}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:25px 0}.chip{background:var(--soft);padding:7px 10px;font-size:11px}.buy-box{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:19px 0;margin-top:22px}.buy-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em}.price{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-top:6px}.stock{color:var(--green);font-size:12px;margin-top:4px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.btn{height:46px;border:1px solid var(--ink);padding:0 19px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer}.btn.primary{background:var(--ink);color:#fff}.btn.secondary{background:#fff}.btn:hover{transform:translateY(-2px);transition:.2s}.market-note{font-size:12px;color:var(--muted);margin-top:20px}
    .anchor{position:sticky;top:76px;z-index:10;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.anchor-inner{display:flex;gap:27px;overflow:auto}.anchor a{padding:15px 0;color:var(--muted);font-size:12px;white-space:nowrap;border-bottom:2px solid transparent}.anchor a:hover{color:var(--ink)}
    main{padding-bottom:100px}.section{padding:68px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.kicker{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.section h2{font-size:clamp(27px,3vw,42px);letter-spacing:-.055em;line-height:1.08;margin:8px 0 0}.section-head p{max-width:430px;color:var(--muted);margin:0}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.quick-item{padding:22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:105px}.quick-item span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.quick-item b{display:block;font-size:19px;margin-top:10px}.spec-layout{display:grid;grid-template-columns:1fr 1fr;gap:70px}.spec-group h3{font-size:15px;margin:0 0 12px}.spec-table{border-top:1px solid var(--line)}.spec-row{display:grid;grid-template-columns:44% 56%;padding:14px 0;border-bottom:1px solid var(--line)}.spec-row span{color:var(--muted)}.feature-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:70px}.highlight-list{padding:0;margin:0;list-style:none}.highlight-list li{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:13px}.highlight-list li:before{content:"+";color:var(--green);font-weight:800}.feature-list,.color-list{display:flex;flex-wrap:wrap;gap:8px}.feature,.color{border:1px solid var(--line);padding:9px 11px;font-size:12px}.color{display:flex;align-items:center;gap:7px}.color i{width:13px;height:13px;border-radius:50%;border:1px solid #bbc0c3}.export-panel{background:#14201c;color:#fff;padding:38px}.export-panel .kicker{color:#83c8a8}.export-panel h2{margin-bottom:15px}.export-panel p{max-width:760px;color:#c6d4ce;line-height:1.85}.export-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#ffffff2c;margin-top:27px}.export-grid div{background:#14201c;padding:19px}.export-grid span{display:block;color:#92aa9f;font-size:11px}.export-grid b{display:block;margin-top:8px}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.related{background:var(--soft);padding:12px;transition:.3s}.related:hover{transform:translateY(-4px)}.related img{width:100%;aspect-ratio:1.4;object-fit:contain;background:#e8eaea}.related b{display:block;margin:13px 3px 2px}.related small{color:var(--muted);margin-left:3px}.bottom-cta{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:42px 0}.bottom-cta h2{margin:0;font-size:clamp(25px,3vw,38px);letter-spacing:-.05em}.mobile-quote{display:none}
    @keyframes enter{from{opacity:0;transform:scale(1.06) translateY(15px)}to{opacity:1;transform:none}}@media(max-width:900px){.top{grid-template-columns:1fr;gap:15px}.summary{padding-top:0}.summary h1{font-size:52px}.spec-layout,.feature-layout{grid-template-columns:1fr;gap:42px}.quick-grid{grid-template-columns:repeat(2,1fr)}.export-grid{grid-template-columns:1fr 1fr}.related-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{width:min(100% - 30px,1240px)}header{height:66px}.brand span{font-size:14px}.nav-right{gap:4px}.back{font-size:0;width:38px;padding:0}.back:before{content:"←";font-size:18px}.lang{padding:0 9px}.crumbs{padding-top:17px}.top{padding-bottom:36px}.main-frame{aspect-ratio:1.1}.summary h1{font-size:45px}.quick-item{padding:16px;min-height:94px}.quick-item b{font-size:16px}.section{padding:48px 0}.section-head{display:block}.section-head p{margin-top:13px}.export-grid{grid-template-columns:1fr}.related-grid{grid-template-columns:1fr 1fr}.bottom-cta{display:block}.bottom-cta .btn{width:100%;margin-top:20px}.mobile-quote{display:block;position:fixed;left:15px;right:15px;bottom:15px;z-index:30;box-shadow:0 8px 26px #0002}.related-grid{gap:8px}}
  </style>
</head>
<body>
  <header><div class="wrap nav"><a class="brand" href="index.html#vehicles"><img src="assets/logo-transparent.png" alt=""><span>Zhaoshang Zhilian</span></a><div class="nav-right"><a class="back" href="index.html#vehicles" id="backLink">Back to Vehicles</a><button class="lang" data-lang="en">EN</button><button class="lang" data-lang="zh">中</button><button class="lang" data-lang="ar">ع</button><button class="lang" data-lang="ru">RU</button></div></div></header>
  <div id="loading" class="loading">Loading vehicle...</div>
  <div id="page" hidden><div class="wrap"><div class="crumbs"><a href="index.html" id="homeLink">Home</a><span> / </span><a href="index.html#vehicles" id="vehiclesLink">Vehicles</a><span> / </span><b id="crumbName"></b></div>
    <section class="top"><div class="gallery"><div class="main-frame"><img class="main-image" id="mainImage" alt=""><span class="gallery-count" id="galleryCount"></span></div><div class="thumbs" id="thumbs"></div></div><aside class="summary"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="summary-copy" id="description"></p><div class="chips" id="chips"></div><div class="buy-box"><div class="buy-label" id="priceLabel"></div><div class="price" id="price"></div><div class="stock" id="stock"></div></div><div class="actions"><button class="btn primary" id="quoteBtn"></button><a class="btn secondary" id="waBtn" target="_blank">WhatsApp</a></div><p class="market-note" id="marketNote"></p></aside></section></div>
    <div class="anchor"><div class="wrap anchor-inner"><a href="#overview" id="anchorOverview"></a><a href="#specifications" id="anchorSpecs"></a><a href="#equipment" id="anchorEquipment"></a><a href="#export" id="anchorExport"></a></div></div>
    <main class="wrap"><section class="section" id="overview"><div class="section-head"><div><div class="kicker" id="overviewKicker"></div><h2 id="overviewTitle"></h2></div><p id="overviewCopy"></p></div><div class="quick-grid" id="quick"></div></section>
      <section class="section" id="specifications"><div class="section-head"><div><div class="kicker" id="specKicker"></div><h2 id="specTitle"></h2></div></div><div class="spec-layout"><div class="spec-group"><h3 id="vehicleGroupTitle"></h3><div class="spec-table" id="vehicleSpecs"></div></div><div class="spec-group"><h3 id="powerGroupTitle"></h3><div class="spec-table" id="powerSpecs"></div></div></div></section>
      <section class="section" id="equipment"><div class="section-head"><div><div class="kicker" id="equipmentKicker"></div><h2 id="featureTitle"></h2></div></div><div class="feature-layout"><ul class="highlight-list" id="highlights"></ul><div><div class="feature-list" id="features"></div><div class="color-list" id="colors"></div></div></div></section>
      <section class="section" id="export"><div class="export-panel"><div class="kicker" id="exportKicker"></div><h2 id="exportTitle"></h2><p id="notes"></p><div class="export-grid" id="exportGrid"></div></div></section>
      <section class="section"><div class="section-head"><div><div class="kicker" id="relatedKicker"></div><h2 id="relatedTitle"></h2></div></div><div class="related-grid" id="related"></div></section>
      <div class="bottom-cta"><h2 id="ctaTitle"></h2><button class="btn primary" id="bottomQuote"></button></div>
    </main>
  </div>
  <button class="btn primary mobile-quote" id="mobileQuote"></button>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="data/supabase-config.js"></script><script src="vehicle.js?v=vehicle-v2"></script>
